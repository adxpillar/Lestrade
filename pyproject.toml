[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lestrade-edgar"
version = "0.1.0"
description = "SEC EDGAR client + Phase 1 Postgres ingest (Form 4)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34.0"]
ingest = [
  "psycopg2-binary>=2.9.9",
  "lxml>=5.0.0",
]
dev = [
  "pytest>=7.4.0",
  "responses>=0.25.0",
  "psycopg2-binary>=2.9.9",
  "lxml>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
